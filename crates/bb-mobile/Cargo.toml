[package]
name = "bb-mobile"
description = "Bouncy Blobs — iOS / Android entry point (Bevy mobile pattern)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "bb_mobile"
# cdylib: Android loads `libbb_mobile.so` from GameActivity.
# staticlib: for embedding in a native host if ever needed.
# lib: so the iOS executable (src/main.rs) can call `main`.
crate-type = ["lib", "staticlib", "cdylib"]

# iOS: Bevy 0.19's mobile example builds a Rust *executable* and Xcode copies
# it into the .app (rustc links all system frameworks; no ObjC shim needed).
[[bin]]
name = "bb-mobile"
path = "src/main.rs"

[features]
# iOS: buy the full game with StoreKit 2 (compiles ios/StoreKitBridge via
# build.rs). Needs the iOS 15 deployment target; see docs/MobileRelease.md.
storekit = ["bb-game/storekit"]

[dependencies]
bb-game = { path = "../bb-game" }
bevy = { version = "0.19.1", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["android-game-activity"] }

# libc 0.2.190 made SYSPROTO_CONTROL / UTUN_OPT_IFNAME macOS-only, but nix
# 0.31.3 (net feature, pulled in by webrtc-rs via rtc-shared) still uses them
# on every Apple target, so iOS fails to compile. Hold libc at 0.2.189 until
# nix ships a fix; then delete this.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"
