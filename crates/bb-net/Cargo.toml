[package]
name = "bb-net"
description = "Bouncy Blobs networking: rooms and links on the partii engine, phone-controller protocol, eventual-consistency body sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bb-physics = { path = "../bb-physics" }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel = "2.5"
log = "0.4"
partii-engine = { path = "../../../partii/platform/crates/partii-engine", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
partii-engine = { path = "../../../partii/platform/crates/partii-engine", features = ["native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
bb-sim = { path = "../bb-sim" }
bb-level = { path = "../bb-level" }
