[package]
name = "bb-net"
description = "Bouncy Blobs networking: Lobbii signaling, WebRTC transports, phone-controller protocol, eventual-consistency body sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bb-physics = { path = "../bb-physics" }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel = "2.5"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "time", "sync", "net", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
webrtc = "0.21"
async-trait = "0.1"
bytes = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "RtcPeerConnection", "RtcConfiguration", "RtcIceServer", "RtcDataChannel", "RtcDataChannelInit",
    "RtcDataChannelEvent", "RtcDataChannelType", "RtcDataChannelState", "RtcPeerConnectionIceEvent",
    "RtcIceCandidate", "RtcIceCandidateInit", "RtcSessionDescriptionInit", "RtcSdpType",
    "RtcPeerConnectionState", "MessageEvent", "WebSocket", "Window", "Event", "Crypto", "Storage",
] }

[dev-dependencies]
bb-sim = { path = "../bb-sim" }
bb-level = { path = "../bb-level" }
